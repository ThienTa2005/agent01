# Cấu hình deploy lên Render (Blueprint). Xem README mục "Deploy lên Render".
services:
  - type: web
    name: qlearning-maze
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
